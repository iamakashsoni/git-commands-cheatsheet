<div class="prt_about_experiencebox" style="position: relative">
  <div
    style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      z-index: -1;
    "
    [style.background-image]="`url(${this.getFilePath(video.thumbnail)})`"
  ></div>

  <!-- <div
    style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://specials-images.forbesimg.com/imageserve/65c2b35c614635f76b0a382e/Led-Zeppelin-in-Concert-at-Chicago-Stadium---1-20-1975/960x0.jpg?fit=scale');
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      z-index: -1;
    "
  ></div> -->

  <div class="prt_about_experience_info">
    <div>
      <h4>{{ video.title }}</h4>
      <span style="color: #f6483b">{{ video.artistsName }}</span>
      <ul>
        <li><strong>Album Name:</strong> {{ video.albumName }}</li>
        <li><strong>Release Date:</strong> {{ video.createdAt | date }}</li>
        <li><strong>Genre:</strong> {{ video.genre }}</li>
      </ul>
    </div>
    <div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="54"
        height="54"
        viewBox="0 0 24 24"
      >
        <path
          fill="#fff"
          fill-opacity="0"
          stroke="#fff"
          stroke-dasharray="40"
          stroke-dashoffset="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 6l10 6l-10 6Z"
        >
          <animate
            fill="freeze"
            attributeName="fill-opacity"
            begin="0.5s"
            dur="0.5s"
            values="0;1"
          />
          <animate
            fill="freeze"
            attributeName="stroke-dashoffset"
            dur="0.5s"
            values="40;0"
          />
        </path>
      </svg>
    </div>
  </div>
</div>
