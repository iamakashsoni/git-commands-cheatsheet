<div class="prt_close_wrapper">
  <a routerLink="/">
    <img src="images/header/left_arrow.png" alt="Close" class="prt_close" />
  </a>
</div>
<div class="container">
  <div class="prt_about_edulearn_wrapper">
    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
      <div class="prt_heading_wrapper">
        <div class="prt_heading">
          <h1>Audio Songs</h1>
          <p>Listen to the melodies</p>
        </div>
      </div>
      <div class="prt_about_learnsection">
        <div class="row">
          <app-song-item
            *ngFor="let item of Audios; let i = index"
            [song]="item"
            [position]="i"
            (click)="selectSong(item)"
          ></app-song-item>
        </div>
      </div>
    </div>
  </div>
</div>

<app-music-player
  *ngIf="selectedSong != null"
  [song]="selectedSong"
></app-music-player>
